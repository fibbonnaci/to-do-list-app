<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="new-todo-form" class="new-todo">
      <input
        type="text"
        id="new-todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
        required
      >
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" class="filter" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <h2 id="pending-heading" class="section-heading" hidden>Pending</h2>
    <ul id="todo-list" class="todo-list" aria-labelledby="pending-heading"></ul>
    <ul id="done-list" class="todo-list" aria-label="Completed tasks"></ul>

    <p id="empty-state" class="empty-state" hidden></p>

    <footer class="footer">
      <span id="count" class="count"></span>
      <button type="button" id="clear-done" class="clear-done">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
